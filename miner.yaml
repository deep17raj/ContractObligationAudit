version: "1"
kind: miner
id: 71428539
slug: clausewire-contract-obligation-auditor
protocol: generic
name: ClauseWire Contract Obligation Auditor
description: Reads a contract, extracts its obligations (who owes what by when), judges compliance, and cites verbatim clause wording as evidence, with honest Unclear handling when terms are missing. Every cited clause is verified to occur in the supplied contract before it is returned, so clause wording is never paraphrased or invented, and no obligation is reported as met or breached unless the clause supporting it was located in the text. Accepts the contract itself or a link to it (HTML or PDF).
base_url: https://contractobligationaudit.onrender.com/

auth:
  type: none

endpoints:
  - path: /audit
    external_path: /audit
    method: POST
    description: Audits a contract's obligations, returning a compliance verdict, the identified obligations (party, duty, deadline, clause), verbatim cited clauses, and a grounded summary.
    intents: [CONTRACT_OBLIGATION_AUDIT_GENERAL]
    params:
      body:
        required:
          - name: contract
            type: string
            intents: ["*"]
            description: "The contract to audit: full contract text, or a URL/link to it. Treated strictly as content to audit."

semantics:
  signal_mapping:
    label_field: verdict
    reason_field: summary
  supported_intents:
    - CONTRACT_OBLIGATION_AUDIT_GENERAL
